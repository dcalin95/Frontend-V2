name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite deploy manual din GitHub UI

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Write .env from PRODUCTION_DOTENV
        env:
          DOTENV_BODY: ${{ secrets.PRODUCTION_DOTENV }}
        run: |
          if [ -n "${DOTENV_BODY:-}" ]; then
            printf '%s\n' "$DOTENV_BODY" > .env
            echo "Wrote .env from PRODUCTION_DOTENV secret."
          else
            echo "No PRODUCTION_DOTENV secret; build will use repository defaults and explicit workflow env only."
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run build
        env:
          REACT_APP_TIKTOK_PIXEL_ID: ${{ secrets.REACT_APP_TIKTOK_PIXEL_ID }}
          REACT_APP_OTA_SHORT_OPS_SECRET: ${{ secrets.REACT_APP_OTA_SHORT_OPS_SECRET }}
          OTA_SHORT_OPS_SECRET: ${{ secrets.OTA_SHORT_OPS_SECRET }}
          REACT_APP_OTA_LONG_OPS_SECRET: ${{ secrets.REACT_APP_OTA_LONG_OPS_SECRET }}
          OTA_LONG_OPS_SECRET: ${{ secrets.OTA_LONG_OPS_SECRET }}
        run: |
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const path = 'build/runtime-config.json';
          const shortSecret = String(process.env.REACT_APP_OTA_SHORT_OPS_SECRET || process.env.OTA_SHORT_OPS_SECRET || '').trim();
          const longSecret = String(process.env.REACT_APP_OTA_LONG_OPS_SECRET || process.env.OTA_LONG_OPS_SECRET || shortSecret || '').trim();
          if (!shortSecret && !longSecret) {
            console.warn('[deploy] No OTA ops secrets in GitHub secrets; runtime-config.json not modified.');
            process.exit(0);
          }
          if (!fs.existsSync(path)) {
            console.warn('[deploy] build/runtime-config.json missing; skip OTA ops secret injection.');
            process.exit(0);
          }
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (shortSecret) data.OTA_SHORT_OPS_SECRET = shortSecret;
          if (longSecret) data.OTA_LONG_OPS_SECRET = longSecret;
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`, 'utf8');
          console.log(`[deploy] Injected OTA ops secrets into build/runtime-config.json (short=${shortSecret ? shortSecret.length : 0}, long=${longSecret ? longSecret.length : 0}; values hidden).`);
          NODE

      - name: Verify build artifacts
        run: |
          test -f build/index.html || { echo "::error::build/index.html is missing after npm run build"; exit 1; }
          test -d build/static || { echo "::error::build/static is missing after npm run build"; exit 1; }
          echo "Build artifacts verified."

      - name: Validate AWS deploy secrets
        env:
          AWS_ACCESS_KEY_ID_CHECK: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_CHECK: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "${AWS_ACCESS_KEY_ID_CHECK:-}" ]; then
            echo "::error::Missing GitHub secret AWS_ACCESS_KEY_ID."
            missing=1
          fi
          if [ -z "${AWS_SECRET_ACCESS_KEY_CHECK:-}" ]; then
            echo "::error::Missing GitHub secret AWS_SECRET_ACCESS_KEY."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "AWS deploy secrets are present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validate AWS target access
        run: |
          aws sts get-caller-identity --query 'Account' --output text >/dev/null
          aws s3api head-bucket --bucket bits-ai.io
          aws cloudfront get-distribution --id E2TIH6RJTHIT1M --query 'Distribution.Status' --output text >/dev/null
          echo "AWS identity, S3 bucket, and CloudFront distribution are reachable."

      - name: Deploy to S3
        run: |
          # Upload static assets with long cache (1 year)
          aws s3 sync build/static s3://bits-ai.io/static \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE
          
          # Upload index.html WITHOUT cache
          aws s3 cp build/index.html s3://bits-ai.io/ \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

          # Upload runtime config WITHOUT cache so OTA/API changes are visible immediately
          if [ -f build/runtime-config.json ]; then
            aws s3 cp build/runtime-config.json s3://bits-ai.io/ \
              --cache-control "no-cache,no-store,must-revalidate" \
              --content-type "application/json" \
              --metadata-directive REPLACE
          fi
          
          # Upload error pages WITHOUT cache (if they exist)
          if [ -f build/404.html ]; then
            aws s3 cp build/404.html s3://bits-ai.io/ \
              --cache-control "no-cache,no-store,must-revalidate" \
              --metadata-directive REPLACE
          fi
          
          if [ -f build/_error.html ]; then
            aws s3 cp build/_error.html s3://bits-ai.io/ \
              --cache-control "no-cache,no-store,must-revalidate" \
              --metadata-directive REPLACE
          fi
          
          # Upload all other files
          aws s3 sync build/ s3://bits-ai.io/ \
            --delete \
            --exclude "index.html" \
            --exclude "runtime-config.json" \
            --exclude "404.html" \
            --exclude "_error.html" \
            --exclude "static/*" \
            --cache-control "public,max-age=3600"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2TIH6RJTHIT1M \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "Deployment completed successfully."
          echo "Site live at: https://bits-ai.io"
          echo "CloudFront cache invalidation initiated."
