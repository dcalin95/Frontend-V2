<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BitSwapDEX - Loading...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #00FFA3;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 255, 163, 0.1);
        border-top: 4px solid #00FFA3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h1 {
        font-size: 1.2rem;
        margin: 0;
        font-weight: 600;
      }
      p {
        font-size: 0.9rem;
        opacity: 0.7;
        margin: 10px 0 0 0;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <h1>BitSwapDEX</h1>
      <p>Loading AI Hub...</p>
    </div>
    <script>
      // Preserve the current path and redirect to index.html
      // React Router will handle the routing once the app loads
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Store the original path in sessionStorage for React Router
        try {
          sessionStorage.setItem('redirectPath', path + search + hash);
        } catch(e) {}
        
        // Redirect to index.html
        window.location.replace('/index.html' + search + hash);
      })();
    </script>
  </body>
</html>
