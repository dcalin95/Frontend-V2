[package]
name = "sei-swap-executor"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# CosmWasm core dependencies
cosmwasm-std = { version = "1.1", features = ["staking"] }
cosmwasm-storage = "1.1"

# Utility dependencies
serde = { version = "1.0", default-features = false, features = ["derive"] }
schemars = "0.8"
thiserror = "1.0"
cw-storage-plus = "0.15"

[dev-dependencies]
cw-multi-test = "0.13"

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
lto = true
codegen-units = 1
