<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Investigator</title>
<style>body{font-family:Arial,sans-serif;max-width:1180px;margin:30px auto;padding:0 18px;background:#f5f6f8;color:#18202a}header,.card{background:white;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #00000012}input,select,button{padding:12px;border:1px solid #ccd2da;border-radius:8px}input{width:55%}button{cursor:pointer;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#eef1f5;padding:14px;border-radius:8px}.risk{font-size:28px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid #e7e9ed}#graph{min-height:260px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.node{padding:10px;border:2px solid #8993a0;border-radius:20px;background:white}.subject{border-width:4px}.edge{font-size:12px;background:#eef1f5;padding:7px;border-radius:8px}@media(max-width:750px){.stats{grid-template-columns:1fr 1fr}input{width:100%;box-sizing:border-box;margin-bottom:8px}}</style></head>
<body><header><h1>Crypto Investigator MVP</h1><p>Analiză preliminară pentru adrese EVM. Fără cheie API rulează automat cu date demonstrative.</p><input id="address" value="0x2B6eD29A95753C3Ad948348e3e7b1A251080Ffb9"><select id="chain"><option value="1">Ethereum</option><option value="56">BNB Chain</option><option value="8453">Base</option></select> <button onclick="run()">Analizează</button></header>
<div id="output"></div><script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function run(){const a=document.getElementById('address').value.trim(),c=document.getElementById('chain').value,o=document.getElementById('output');o.innerHTML='<div class="card">Se analizează…</div>';try{const r=await fetch(`/api/analyse/${a}?chain_id=${c}`),d=await r.json();if(!r.ok)throw Error(d.detail||'Eroare');o.innerHTML=`<div class="card stats"><div class="stat"><b>Risc</b><div class="risk">${d.risk_score}/100</div>${esc(d.risk_level)}</div><div class="stat"><b>Transferuri</b><div class="risk">${d.transfer_count}</div></div><div class="stat"><b>Contrapartide</b><div class="risk">${d.counterparties}</div></div><div class="stat"><a href="/api/report/${a}.pdf?chain_id=${c}">Descarcă raport PDF</a></div></div><div class="card"><h2>Semnale</h2>${d.signals.length?d.signals.map(s=>`<p><b>${esc(s.label)} (+${s.points})</b><br>${esc(s.evidence)}</p>`).join(''):'<p>Nu au fost detectate semnale pe eșantionul disponibil.</p>'}</div><div class="card"><h2>Graf simplificat</h2><div id="graph">${d.nodes.map(n=>`<span class="node ${n.kind}">${esc(n.label)}</span>`).join('')}${d.edges.map(e=>`<span class="edge">${esc(e.source.slice(0,6))} → ${esc(e.target.slice(0,6))}: ${esc(e.amount)} ${esc(e.symbol)}</span>`).join('')}</div></div><div class="card"><h2>Transferuri</h2><table><tr><th>Data</th><th>Token</th><th>Cantitate</th><th>De la</th><th>Către</th></tr>${d.transfers.map(t=>`<tr><td>${esc(t.timestamp)}</td><td>${esc(t.token_symbol)}</td><td>${esc(t.amount)}</td><td>${esc(t.sender)}</td><td>${esc(t.recipient)}</td></tr>`).join('')}</table><p><small>${esc(d.disclaimer)}</small></p></div>`}catch(e){o.innerHTML=`<div class="card">Eroare: ${esc(e.message)}</div>`}}
</script></body></html>
